<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tournament Dashboard</title>
  <link rel="stylesheet" href="tournaments.css" />
</head>
<body>

  <div class="dashboard-container">
    <h2 id="pageHeading"></h2>

    <div class="split-section">
      <!-- Join Tournament -->
      <div class="join-section">
        <h3>Join Tournament</h3>
        <input type="text" placeholder="Enter Tournament Code or Name" />
        <button>Join</button>
      </div>

      <!-- Host Tournament -->
      <div class="create-section">
        <h3>Host New Tournament</h3>

        <input type="text" id="tourneyName" placeholder="Tournament Name" required />

        <select id="tourneyGame" required>
          <option value="">-- Select Game --</option>
          <option>BGMI</option>
          <option>COD</option>
          <option>Valorant</option>
          <option>Clash of Clans</option>
          <option>Pokemon Unite</option>
          <option>League of Legends</option>
          <option>Clash Royale</option>
          <option>Apex Legends</option>
          <option>Asphalt 9</option>
          <option>CS:GO</option>
          <option>Rocket League</option>
          <option>FIFA Mobile</option>
        </select>

        <input type="number" id="teamCount" placeholder="Number of Teams" min="2" max="64" required />
        <input type="text" id="prize" placeholder="Prize Pool (₹)" required />
        <input type="date" id="tourneyDate" required />
        <input type="time" id="tourneyTime" required />

        <label for="poster" style="margin-top:10px;">Upload Poster (optional):</label>
        <input type="file" id="poster" accept="image/*" />

        <input type="text" id="tourneyId" placeholder="Tournament ID" readonly />
        <button onclick="generateTournamentId()">Generate ID</button>
        <button onclick="hostTournament()">Create & Share</button>
      </div>
    </div>
    
    <a href="tournament.html" class="back-btn">⬅ Back</a>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const name = urlParams.get('name');
    const game = urlParams.get('game');
    document.getElementById('pageHeading').textContent = `Welcome ${name} to ${game} Tournament Zone!`;

    function generateTournamentId() {
      const id = 'TID-' + Math.floor(100000 + Math.random() * 900000);
      document.getElementById('tourneyId').value = id;
    }

    function hostTournament() {
      const name = document.getElementById('tourneyName').value;
      const game = document.getElementById('tourneyGame').value;
      const teams = document.getElementById('teamCount').value;
      const prize = document.getElementById('prize').value;
      const date = document.getElementById('tourneyDate').value;
      const time = document.getElementById('tourneyTime').value;
      const id = document.getElementById('tourneyId').value;

      if (!name || !game || !teams || !prize || !date || !time || !id) {
        alert("Please fill all fields and generate a Tournament ID.");
        return;
      }

      alert(`✅ Tournament "${name}" hosted successfully!\n\n🆔 ID: ${id}\n🎮 Game: ${game}\n👥 Teams: ${teams}\n🏆 Prize: ${prize}\n📅 Date: ${date}\n⏰ Time: ${time}`);
    }
  </script>

</body>
</html>
