<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Runner Game</title>
    <style>
        #gameButtons {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            margin-top: 20px;
        }

        #gameButtons button {
            padding: 10px 20px;
            font-size: 30px;
            margin: 10px auto;
            border: none;
            border-radius: 6px;
            background-color: #2196f3;
            color: white;
            cursor: pointer;
            display: block;
        }

        #gameButtons button:hover {
            background-color: #0b7dda;
        }

        #restartButton {
            background-color: #2196f3;
        }

        #restartButton:hover {
            background-color: #0b7dda;
        }
        h2 {
    font-size: 50px; /* Heading 2 font size */
}
li {
    font-size: 34px; /* Adjust this value to increase/decrease font size */
}
    </style>
</head>
<body>
    <div id="rulesOverlay" style="display: block; text-align: center; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px; background-color: rgba(0, 0, 0, 0.7); color: white; border-radius: 10px;">
        <h2>Game Rules</h2>
        <ul>
            <li>Use arrow keys to move the player.</li>
            <li>Avoid obstacles and collect stars to score points.</li>
            <li>Click 'Start' to begin the game.</li>
        </ul>
        <button id="startButton" onclick="startGame()">Start Game</button>
    </div>
    
    <!-- Game Buttons -->
    <div id="gameButtons" style="display: none; text-align: center; margin-top: 20px;">
        <button id="restartButton" onclick="restartGame()">🔄 Restart Game</button>
        <button id="backButton" onclick="goToHome()">⬅️ Back to Home</button>
    </div>

    <!-- 👇 Phaser & game code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.55.2/phaser.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
