<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candy Crush</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="game-page">
    <h1>Candy Crush Saga</h1>
    <p>Candy Crush Saga, developed by King, is one of the most addictive match-3 puzzle games ever created! Match colorful candies, clear levels, and embark on a journey through a candy-filled world.</p>
    <!-- In-game images -->
    <div class="game-images">
      <img src="Images/trending3-screenshot1.jpg" alt="Game 3 Screenshot 1">
      <img src="Images/trending3-screenshot2.png" alt="Game 3 Screenshot 2">
      <img src="Images/trending3-screenshot3.png" alt="Game 3 Screenshot 3">
      <img src="Images/trending3-screenshot4.png" alt="Game 3 Screenshot 4">
      <img src="Images/trending3-screenshot5.png" alt="Game 3 Screenshot 5">
      <img src="Images/trending3-screenshot6.png" alt="Game 3 Screenshot 6">
      <img src="Images/trending3-screenshot7.png" alt="Game 3 Screenshot 7">
      <img src="Images/trending3-screenshot8.png" alt="Game 3 Screenshot 8">
      <img src="Images/trending3-screenshot9.jpg" alt="Game 3 Screenshot 9">
      <img src="Images/trending3-screenshot10.webp" alt="Game 3 Screenshot 10">
    </div>

    <a href="../index.html" class="back-button">Back to Home</a>
  </div>

  <!-- Lightbox container -->
  <div id="lightbox" class="lightbox hidden">
    <span class="close">&times;</span>
    <img class="lightbox-content" id="lightbox-img" alt="Lightbox Image">
  </div>

  <script src="script.js"></script>
</body>
</html>
