  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roblox</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="game-page">
    <h1>Roblox</h1>
    <p>Roblox is an online game creation platform and game-playing system developed by Roblox Corporation. It allows users to create, share, and play games made by other users in an ever-expanding virtual world!</p>
    <!-- In-game images -->
    <div class="game-images">
      <img src="Images/trending2-screenshot1.jpeg" alt="Game 2 Screenshot 1">
      <img src="Images/trending2-screenshot2.jpeg" alt="Game 2 Screenshot 2">
      <img src="Images/trending2-screenshot3.jpeg" alt="Game 2 Screenshot 3">
      <img src="Images/trending2-screenshot4.jpeg" alt="Game 2 Screenshot 4">
      <img src="Images/trending2-screenshot5.jpeg" alt="Game 2 Screenshot 5">

      <img src="Images/trending2-screenshot7.jpeg" alt="Game 2 Screenshot 7">
      <img src="Images/trending2-screenshot8.jpeg" alt="Game 2 Screenshot 8">
      <img src="Images/trending2-screenshot9.png" alt="Game 2 Screenshot 9">
      <img src="Images/trending2-screenshot10.jpg" alt="Game 2 Screenshot 10">
    </div>

    <a href="../index.html" class="back-button">Back to Home</a>

  <div id="lightbox" class="lightbox hidden">
    <span class="close">&times;</span>
    <img class="lightbox-content" id="lightbox-img" alt="Lightbox Image">
  </div>
