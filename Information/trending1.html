<!DOCTYPE html>

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subway Surfers</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="game-page">
    <h1>Subway Surfers</h1>
    <p>Subway Surfers, developed by Kiloo and SYBO Games, is one of the most popular endless runner games. Sprint through vibrant cities, dodge trains, and collect coins in this fast-paced, action-packed adventure!</p>
    <!-- In-game images -->
    <div class="game-images">
      <img src="Images/trending1-screenshot1.webp" alt="Game 1 Screenshot 1">
      <img src="Images/trending1-screenshot2.jpg" alt="Game 1 Screenshot 2">
      <img src="Images/trending1-screenshot3.png" alt="Game 1 Screenshot 3">
      <img src="Images/trending1-screenshot4.webp" alt="Game 1 Screenshot 4">
      <img src="Images/trending1-screenshot5.webp" alt="Game 1 Screenshot 5">
      <img src="Images/trending1-screenshot6.webp" alt="Game 1 Screenshot 6">
      <img src="Images/trending1-screenshot7.png" alt="Game 1 Screenshot 7">
      <img src="Images/trending1-screenshot8.png" alt="Game 1 Screenshot 8">
      <img src="Images/trending1-screenshot9.png" alt="Game 1 Screenshot 9">
      <img src="Images/trending1-screenshot10.jpg" alt="Game 1 Screenshot 10">
    </div>

    <a href="../index.html" class="back-button">Back to Home</a>
  </div>

  <!-- Lightbox container -->
  <div id="lightbox" class="lightbox hidden">
    <span class="close">&times;</span>
    <img class="lightbox-content" id="lightbox-img" alt="Lightbox Image">
  </div>

  <script src="script.js"></script>
